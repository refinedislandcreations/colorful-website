<section
  id="opening-section"
  class="relative flex items-center justify-center min-h-screen w-full bg-[#f7e7ee] px-6 py-20 md:py-32 overflow-hidden"
>
  <div
    class="overlay absolute inset-0 bg-black transition-all duration-300 pointer-events-none z-20 opacity-0"
  ></div>

  <!-- Follow-Cursor Image -->
  <div
    id="hover-image"
    class="pointer-events-none fixed opacity-0 transition-opacity duration-200 z-[9999]"
    style="width: 260px; height: 380px"
  >
    <img
      id="hover-image-src"
      src=""
      alt="Preview"
      class="w-full h-full object-cover rounded-t-full rounded-b-xl shadow-2xl"
    />
  </div>

  <div class="max-w-3xl mx-auto text-center relative z-40">
    <p
      id="main-paragraph"
      class="text-[#d9336c] font-semibold leading-relaxed text-2xl sm:text-3xl md:text-4xl lg:text-[2.75rem] transition-colors duration-300"
    >
      Each room category embraces a calm, open atmosphere—highlighted by
      <span
        class="underline text-[#0033FF] decoration-2 underline-offset-4 cursor-pointer hover-word"
        data-img="https://images.unsplash.com/photo-1616046229478-9901c5536a45?auto=format&fit=crop&w=600&q=80"
        >clean</span
      >
      lines,
      <span
        class="underline text-[#0033FF] decoration-2 underline-offset-4 cursor-pointer hover-word"
        data-img="https://images.unsplash.com/photo-1612320583354-02dd0cf04612?q=80&w=2672&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        >pastels</span
      >, and gentle
      <span
        class="underline text-[#0033FF] decoration-2 underline-offset-4 cursor-pointer hover-word"
        data-img="https://images.unsplash.com/photo-1756314164620-27fd6ccad7ea?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        >lighting</span
      >.
    </p>
  </div>
</section>

<style>
  #main-paragraph {
    color: #d9336c;
  }
  .hover-word {
    color: #0033ff;
    transition: color 0.3s;
  }

  /* Responsive image container */
  @media (max-width: 1024px) {
    #hover-image {
      width: 220px !important;
      height: 320px !important;
    }
  }
  @media (max-width: 640px) {
    #hover-image {
      width: 160px !important;
      height: 240px !important;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const hoverWords = document.querySelectorAll(".hover-word");
    const hoverImage = document.getElementById("hover-image");
    const hoverImageSrc = document.getElementById("hover-image-src");
    const paragraph = document.getElementById("main-paragraph");

    const originalParagraphColor = "#d9336c";
    const originalSpanColor = "#0033FF";
    const softGreyColor = "#999";

    function getImageSize() {
      const w = hoverImage.offsetWidth;
      const h = hoverImage.offsetHeight;
      return { w, h };
    }

    function positionImage(e) {
      const { w, h } = getImageSize();

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const spaceAbove = e.clientY;
      const spaceBelow = vh - e.clientY;
      const spaceRight = vw - e.clientX;

      let posX = e.clientX + 30;
      let posY = e.clientY - h - 20;

      if (spaceAbove < h + 30) {
        posY = e.clientY + 30;
      }
      if (spaceRight < w + 40) {
        posX = e.clientX - w - 30;
      }

      posY = Math.max(20, Math.min(posY, vh - h - 20));

      hoverImage.style.left = posX + "px";
      hoverImage.style.top = posY + "px";
    }

    // MOUSEMOVE (desktop / laptop)
    document.addEventListener("mousemove", positionImage);

    // HOVER IN
    hoverWords.forEach((word) => {
      function showImage() {
        hoverImageSrc.src = this.dataset.img;
        hoverImage.style.opacity = "1";

        paragraph.style.color = softGreyColor;

        hoverWords.forEach((span) => {
          span.style.color = span === this ? originalSpanColor : softGreyColor;
        });
      }

      function hideImage() {
        hoverImage.style.opacity = "0";
        paragraph.style.color = originalParagraphColor;

        hoverWords.forEach((span) => (span.style.color = originalSpanColor));
      }

      // Desktop hover
      word.addEventListener("mouseenter", showImage);
      word.addEventListener("mouseleave", hideImage);

      // Touch devices → tap to show
      word.addEventListener("touchstart", (e) => {
        e.preventDefault();
        showImage.call(word);
      });
    });

    // Touch devices → tap elsewhere to hide
    document.addEventListener("touchstart", (e) => {
      if (!e.target.closest(".hover-word")) {
        hoverImage.style.opacity = "0";
      }
    });
  });
</script>
