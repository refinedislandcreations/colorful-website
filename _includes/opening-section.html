<section
  id="opening-section"
  class="relative flex items-center justify-center min-h-screen w-full bg-[#f7e7ee] px-6 py-20 md:py-32 overflow-hidden"
>
  <div
    class="overlay absolute inset-0 bg-black transition-all duration-300 pointer-events-none z-20 opacity-0"
  ></div>

  <!-- Follow-Cursor Image -->
  <div
    id="hover-image"
    class="pointer-events-none fixed w-64 h-96 opacity-0 transition-opacity duration-200 z-[9999]"
  >
    <img
      id="hover-image-src"
      src=""
      alt="Preview"
      class="w-full h-full object-cover rounded-t-full rounded-b-xl shadow-2xl"
    />
  </div>

  <div class="max-w-3xl mx-auto text-center relative z-40">
    <p
      id="main-paragraph"
      class="text-[#d9336c] font-semibold leading-relaxed text-2xl sm:text-3xl md:text-4xl lg:text-[2.75rem] transition-colors duration-300"
    >
      Each room category embraces a calm, open atmosphere—highlighted by
      <span
        class="underline text-[#0033FF] decoration-2 underline-offset-4 cursor-pointer hover-word transition-colors duration-300"
        data-img="https://images.unsplash.com/photo-1616046229478-9901c5536a45?auto=format&fit=crop&w=600&q=80"
        >clean</span
      >
      lines,
      <span
        class="underline text-[#0033FF] decoration-2 underline-offset-4 cursor-pointer hover-word transition-colors duration-300"
        data-img="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?auto=format&fit=crop&w=600&q=80"
        >pastels</span
      >, and gentle
      <span
        class="underline text-[#0033FF] decoration-2 underline-offset-4 cursor-pointer hover-word transition-colors duration-300"
        data-img="https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?auto=format&fit=crop&w=600&q=80"
        >lighting</span
      >.
    </p>
  </div>
</section>

<style>
  #main-paragraph {
    color: #d9336c;
  }
  .hover-word {
    color: #0033ff;
    transition: color 0.3s;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const hoverWords = document.querySelectorAll(".hover-word");
    const hoverImage = document.getElementById("hover-image");
    const hoverImageSrc = document.getElementById("hover-image-src");
    const paragraph = document.getElementById("main-paragraph");

    const originalParagraphColor = "#d9336c";
    const originalSpanColor = "#0033FF";
    const softGreyColor = "#999";

    const IMAGE_WIDTH = 260; // px
    const IMAGE_HEIGHT = 380; // px

    // SMART POSITIONING LOGIC
    document.addEventListener("mousemove", (e) => {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      let posX = e.clientX + 40; // default right side
      let posY = e.clientY - IMAGE_HEIGHT - 20; // default above cursor

      const spaceAbove = e.clientY;
      const spaceBelow = viewportHeight - e.clientY;
      const spaceRight = viewportWidth - e.clientX;
      const spaceLeft = e.clientX;

      // If small space above → place below
      if (spaceAbove < IMAGE_HEIGHT + 30) {
        posY = e.clientY + 30;
      }

      // If small space on right → place left side
      if (spaceRight < IMAGE_WIDTH + 40) {
        posX = e.clientX - IMAGE_WIDTH - 40;
      }

      // If small space both above & below, clamp to stay in view
      posY = Math.max(20, Math.min(posY, viewportHeight - IMAGE_HEIGHT - 20));

      hoverImage.style.left = posX + "px";
      hoverImage.style.top = posY + "px";
    });

    hoverWords.forEach((word) => {
      word.addEventListener("mouseenter", function () {
        hoverImageSrc.src = this.dataset.img;
        hoverImage.style.opacity = "1";

        paragraph.style.color = softGreyColor;

        hoverWords.forEach((span) => {
          span.style.color = span === this ? originalSpanColor : softGreyColor;
        });
      });

      word.addEventListener("mouseleave", resetAll);
    });

    function resetAll() {
      hoverImage.style.opacity = "0";
      paragraph.style.color = originalParagraphColor;

      hoverWords.forEach((span) => {
        span.style.color = originalSpanColor;
      });
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".hover-word")) resetAll();
    });
  });
</script>
