<!-- _includes/corporate-offers-section.html -->
<!---------------- CORPORATE OFFERS - DIFFERENT STYLE ---------------->
<section class="bg-brand-pink py-20 overflow-hidden">
  <div class="container mx-auto px-4">
    <h2
      class="text-4xl font-bold text-center mb-16 opacity-0"
      id="corporate-heading"
    >
      {{ include.section.heading }}
    </h2>

    <div class="grid md:grid-cols-2 gap-12">
      {% for service in include.section.services %}
      <!-- {{ service.title }} -->
      <div
        class="bg-white rounded-3xl p-8 shadow-2xl opacity-0 {% if forloop.index == 1 %}-translate-x-10{% else %}translate-x-10{% endif %}"
        id="{% if service.title == 'Corporate Benefits' %}corporate-benefits{% else %}group-benefits{% endif %}"
      >
        <h3 class="text-3xl font-bold mb-6 text-center">{{ service.title }}</h3>
        <div class="space-y-4">
          {% for item in service.items %}
          <div class="flex items-start p-4 bg-brand-pink rounded-xl">
            <span class="text-2xl mr-4">{{ item.icon }}</span>
            <div>
              <h4 class="font-bold text-lg">{{ item.title }}</h4>
              <p class="text-gray-600">{{ item.description }}</p>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="text-center mt-12 opacity-0" id="corporate-cta">
      <a
        href="{{ include.section.cta_url }}"
        class="bg-brand-orange text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-black transition-colors inline-block"
      >
        {{ include.section.cta_text }}
      </a>
    </div>
  </div>
</section>
