<!-- _includes/hero-section.html -->
<header
  class="relative flex flex-col justify-center items-center min-h-screen bg-cover bg-center bg-no-repeat text-white overflow-hidden px-4"
  style="background-image: url('{{ include.section.background_image }}');"
>
  <!-- Navigation -->
  <nav class="absolute top-4 left-4 z-10">
    <a href="#" class="text-lg sm:text-xl font-bold opacity-0" id="logo">
      {{ include.section.logo_text }}
    </a>
  </nav>

  <!-- Contact Button -->
  <a
    href="{{ include.section.contact_url }}"
    class="absolute top-4 right-4 border-2 border-white rounded-full px-3 py-1 sm:px-4 sm:py-2 text-sm sm:text-base opacity-0 hover:bg-white hover:text-black transition-colors duration-300"
    id="contact-btn"
  >
    {{ include.section.contact_button }}
  </a>

  <!-- Hero Content -->
  <div class="text-center z-10 max-w-[90%] sm:max-w-[80%]">
    <h1
      class="font-titan-one opacity-0 leading-tight text-4xl sm:text-6xl md:text-8xl lg:text-9xl"
      id="hero-heading"
    >
      {{ include.section.heading_line1 }} <br />
      <span class="opacity-0" id="hero-heading-2">
        {{ include.section.heading_line2 }}
      </span>
    </h1>

    <h2
      class="opacity-0 mt-4 text-base sm:text-xl md:text-2xl lg:text-3xl"
      id="hero-subheading"
    >
      {{ include.section.subheading }}
    </h2>

    <a
      href="{{ include.section.cta_url }}"
      class="inline-block mt-6 bg-white text-black rounded-full px-5 py-2 sm:px-8 sm:py-3 text-sm sm:text-base md:text-lg opacity-0 hover:bg-black hover:text-white transition-colors duration-300"
      id="hero-cta"
    >
      {{ include.section.cta_button }}
    </a>
  </div>

  <!-- Responsive Wave SVG -->
  <div
    class="absolute bottom-0 left-0 w-full overflow-hidden leading-none z-0 opacity-0"
    id="header-wave"
  >
    <svg
      class="block w-full h-auto rotate-180"
      viewBox="0 0 1440 111"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="none"
    >
      <path
        d="M1816 31.6148C1724.67 31.6148 1724.67 111 1633.31 111C1541.96 111 1541.98 31.6148 1450.63 31.6148C1359.27 31.6148 1359.29 111 1267.96 111C1176.63 111 1176.63 31.6148 1085.29 31.6148C993.959 31.6148 993.959 111 902.626 111C811.293 111 811.293 31.6148 719.959 31.6148C628.626 31.6148 628.626 111 537.293 111C445.959 111 445.959 31.6148 354.626 31.6148C263.293 31.6148 263.293 111 171.959 111C80.6261 111 80.6261 31.6148 -10.7072 31.6148C-102.041 31.6148 -102.041 111 -193.354 111C-284.667 111 -284.667 31.6148 -376 31.6148V0H720H1816V31.6148Z"
        fill="#EEC1DC"
      />
    </svg>
  </div>
</header>
