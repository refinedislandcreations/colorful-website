<section
  id="hero"
  class="hero-section relative w-screen h-screen overflow-hidden bg-white flex items-center justify-center"
>
  <!-- ✅ Desktop Navbar Inside Hero (Top-Right Overlay) -->
  <div
    id="desktop-navbar"
    class="hidden lg:flex absolute top-0 right-0 z-20 py-8 px-8 text-[#f8efc1] opacity-0"
  >
    <div class="flex flex-col items-end dm-sans-medium">
      {% for item in include.navigation %}
      <a
        href="{{ item.url }}"
        class="relative group text-right w-full py-1 uppercase text-base transition-all duration-300 hover:opacity-80 group-hover:scale-105 after:absolute after:bottom-0 after:left-0 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-300 group-hover:after:w-full"
      >
        {{ item.name }}
      </a>
      {% endfor %}
      <a
        href="#"
        class="px-6 py-2 rounded-full transition-all duration-300 dm-sans-regular text-center uppercase text-sm mt-2"
        style="background-color: {{ include.book_now_button.bg_color }}; color: {{ include.book_now_button.text_color }};"
        onmouseover="this.style.backgroundColor='{{ include.book_now_button.hover_bg }}'; this.style.color='{{ include.book_now_button.hover_text }}';"
        onmouseout="this.style.backgroundColor='{{ include.book_now_button.bg_color }}'; this.style.color='{{ include.book_now_button.text_color }}';"
      >
        {{ include.book_now_button.text }}
      </a>
    </div>
  </div>

  <!-- Background with animated clip -->
  <div
    id="clipped-content"
    class="absolute inset-0 bg-cover bg-center z-0"
    style="
      clip-path: polygon(45% 45%, 55% 45%, 55% 55%, 45% 55%);
      background-image: url('{{ include.background_image }}');
    "
  ></div>

  <!-- Text content -->
  <div
    id="hero-content"
    class="absolute inset-0 z-10 flex flex-col justify-end px-4 text-white opacity-0"
  >
    <div
      class="flex flex-col sm:flex-row justify-between items-end gap-6 sm:gap-0"
    >
      <h1
        class="text-[12vw] sm:text-[6rem] md:text-[8rem] lg:text-[10rem] uppercase tracking-tight leading-[0.9] montserrat-black text-left"
      >
        <span class="block font-bold" data-reveal>{{ include.title }}</span>
      </h1>

      <p
        class="text-base sm:text-lg md:text-2xl max-w-sm sm:max-w-md md:max-w-lg text-right dm-sans-regular"
        data-reveal
      >
        {{ include.subtitle }}
      </p>
    </div>
  </div>
</section>

<!-- ✅ GSAP Animation -->
<script>
  // ✅ Hanya script ini yang mengatur scroll awal
  window.history.scrollRestoration = "manual";
  window.scrollTo(0, 0);

  document.addEventListener("DOMContentLoaded", () => {
    // Lock scroll selama animasi awal
    document.body.style.overflow = "hidden";

    const clippedContent = document.getElementById("clipped-content");
    const heroContent = document.getElementById("hero-content");
    const textLines = document.querySelectorAll("[data-reveal]");

    gsap.registerPlugin(ScrollTrigger);
    gsap.set(textLines, { opacity: 0, y: 30 });

    const tl = gsap.timeline({
      defaults: { ease: "power2.inOut" },
      onComplete: () => {
        gsap.to("body", {
          overflow: "auto",
          delay: 0.2,
          duration: 0,
          onComplete: () => {
            ScrollTrigger.refresh();

            // ✅ Fade in mobile (external) navbar
            const navbar = document.getElementById("amara-navbar");
            if (navbar) {
              navbar.classList.add("visible");
            }

            // ✅ Fade in desktop navbar (inside hero)
            const desktopNavbar = document.getElementById("desktop-navbar");
            if (desktopNavbar) {
              gsap.to(desktopNavbar, {
                opacity: 1,
                duration: 1,
                ease: "power2.out",
              });
            }
          },
        });
      },
    });

    tl.to(clippedContent, {
      clipPath: "polygon(0% 45%, 100% 45%, 100% 55%, 0% 55%)",
      duration: 1,
      ease: "power1.out",
      delay: 0.3,
    })
      .to(clippedContent, {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
        duration: 1.2,
        ease: "power2.inOut",
      })
      .to(heroContent, { opacity: 1, duration: 0.8 }, ">")
      .to(
        textLines,
        {
          opacity: 1,
          y: 0,
          duration: 0.8,
          stagger: 0.15,
          ease: "power3.out",
        },
        "<"
      );
  });
</script>
