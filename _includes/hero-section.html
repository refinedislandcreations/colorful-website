<section
  id="hero"
  class="hero-section relative w-screen h-screen overflow-hidden bg-white flex items-center justify-center"
>
  <!-- Background with animated clip -->
  <div
    id="clipped-content"
    class="absolute inset-0 bg-cover bg-center z-0"
    style="
      clip-path: polygon(45% 45%, 55% 45%, 55% 55%, 45% 55%);
      background-image: url('/assets/images/hero-image.jpg');
    "
  ></div>

  <!-- Text content -->
  <div
    id="hero-content"
    class="absolute inset-0 z-10 flex flex-col justify-end px-4 text-white opacity-0"
  >
    <div
      class="flex flex-col sm:flex-row justify-between items-end gap-6 sm:gap-0"
    >
      <h1
        class="text-[12vw] sm:text-[6rem] md:text-[8rem] lg:text-[10rem] uppercase tracking-tight leading-[0.9] montserrat-black text-left"
      >
        <span class="block font-bold" data-reveal>Amara Isles</span>
      </h1>

      <p
        class="text-base sm:text-lg md:text-2xl max-w-sm sm:max-w-md md:max-w-lg text-right dm-sans-regular"
        data-reveal
      >
        An invitation to breathe and return.
      </p>
    </div>
  </div>
</section>

<!-- ✅ GSAP Animation -->
<script>
  // ✅ Hanya script ini yang mengatur scroll awal
  window.history.scrollRestoration = "manual";
  window.scrollTo(0, 0);

  document.addEventListener("DOMContentLoaded", () => {
    // Lock scroll selama animasi awal
    document.body.style.overflow = "hidden";

    const clippedContent = document.getElementById("clipped-content");
    const heroContent = document.getElementById("hero-content");
    const textLines = document.querySelectorAll("[data-reveal]");

    gsap.registerPlugin(ScrollTrigger);
    gsap.set(textLines, { opacity: 0, y: 30 });

    const tl = gsap.timeline({
      defaults: { ease: "power2.inOut" },
      onComplete: () => {
        // Lepas lock scroll setelah animasi selesai
        gsap.to("body", {
          overflow: "auto",
          delay: 0.2,
          duration: 0,
          onComplete: () => {
            ScrollTrigger.refresh();
          },
        });
      },
    });

    tl.to(clippedContent, {
      clipPath: "polygon(0% 45%, 100% 45%, 100% 55%, 0% 55%)",
      duration: 1,
      ease: "power1.out",
      delay: 0.3,
    })
      .to(clippedContent, {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
        duration: 1.2,
        ease: "power2.inOut",
      })
      .to(heroContent, { opacity: 1, duration: 0.8 }, ">")
      .to(
        textLines,
        {
          opacity: 1,
          y: 0,
          duration: 0.8,
          stagger: 0.15,
          ease: "power3.out",
        },
        "<"
      );
  });
</script>
