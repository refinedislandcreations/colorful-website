<!-- _includes/spa-section.html -->
<!---------------- SPA DETAILS - DIFFERENT LAYOUT ---------------->
<section class="bg-brand-orange py-20 overflow-hidden" id="spa">
  <div class="container mx-auto px-4">
    <div class="flex flex-col lg:flex-row items-center gap-12">
      <!-- Content -->
      <div
        class="lg:w-1/2 text-white opacity-0 -translate-x-10"
        id="spa-content"
      >
        <h2 class="text-4xl font-bold mb-6">{{ include.section.title }}</h2>
        <p class="text-xl mb-8">{{ include.section.description }}</p>
        <div class="grid md:grid-cols-2 gap-6 mb-8">
          {% for feature in include.section.features %}
          <div class="flex items-center">
            <span class="w-2 h-2 bg-white rounded-full mr-3"></span>
            {{ feature }}
          </div>
          {% endfor %}
        </div>
        <div class="flex items-center gap-6">
          <span class="text-2xl font-bold">{{ include.section.price }}</span>
          <a
            href="{{ include.section.button_url }}"
            class="bg-white text-brand-orange px-8 py-3 rounded-full font-bold hover:bg-black hover:text-white transition-colors"
          >
            {{ include.section.button_text }}
          </a>
        </div>
      </div>

      <!-- Image -->
      <div class="lg:w-1/2 opacity-0 translate-x-10" id="spa-image">
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-4">
            <div class="rounded-2xl overflow-hidden shadow-2xl">
              <img
                src="{{ include.section.images[0].src }}"
                alt="{{ include.section.images[0].alt }}"
                class="w-full h-48 object-cover"
              />
            </div>
            <div class="rounded-2xl overflow-hidden shadow-2xl">
              <img
                src="{{ include.section.images[1].src }}"
                alt="{{ include.section.images[1].alt }}"
                class="w-full h-32 object-cover"
              />
            </div>
          </div>
          <div class="space-y-4 pt-8">
            <div class="rounded-2xl overflow-hidden shadow-2xl">
              <img
                src="{{ include.section.images[2].src }}"
                alt="{{ include.section.images[2].alt }}"
                class="w-full h-32 object-cover"
              />
            </div>
            <div class="rounded-2xl overflow-hidden shadow-2xl">
              <img
                src="{{ include.section.images[3].src }}"
                alt="{{ include.section.images[3].alt }}"
                class="w-full h-48 object-cover"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
