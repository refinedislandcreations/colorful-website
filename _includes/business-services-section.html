<!-- _includes/business-services-section.html -->
<!---------------- BUSINESS SERVICES - DIFFERENT STYLE ---------------->
<section class="bg-brand-pink py-20 overflow-hidden">
  <div class="container mx-auto px-4">
    <h2
      class="text-4xl font-bold text-center mb-16 opacity-0"
      id="business-heading"
    >
      {{ include.section.heading }}
    </h2>

    <div class="grid md:grid-cols-2 gap-12">
      {% for service in include.section.services %}
      <!-- {{ service.title }} -->
      <div
        class="bg-white rounded-3xl p-8 shadow-2xl opacity-0 {% if forloop.index == 1 %}-translate-x-10{% else %}translate-x-10{% endif %}"
        id="{% if service.title == 'Business Center' %}business-center{% else %}concierge-services{% endif %}"
      >
        <h3 class="text-3xl font-bold mb-6 text-center">{{ service.title }}</h3>
        <div class="space-y-4">
          {% for item in service.items %}
          <div class="flex items-center p-4 bg-brand-pink rounded-xl">
            <span class="text-2xl mr-4">{{ item.icon }}</span>
            <div>
              <h4 class="font-bold">{{ item.title }}</h4>
              <p class="text-sm text-gray-600">{{ item.description }}</p>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
