<!-- _includes/room-amenities-section.html -->
<!---------------- AMENITIES OVERVIEW - DIFFERENT STYLE ---------------->
<section class="bg-brand-pink py-20 overflow-hidden">
  <div class="container mx-auto px-4">
    <h2
      class="text-4xl font-bold text-center mb-16 opacity-0"
      id="amenities-heading"
    >
      {{ include.section.heading }}
    </h2>

    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
      {% for amenity in include.section.items %}
      <!-- Amenity {{ forloop.index }} -->
      <div
        class="text-center opacity-0 scale-90"
        id="amenity-{{ forloop.index }}"
      >
        <div class="bg-white rounded-2xl p-8 shadow-lg h-full">
          <div
            class="w-16 h-16 bg-brand-orange rounded-full flex items-center justify-center mx-auto mb-4"
          >
            <span class="text-white text-2xl">{{ amenity.icon }}</span>
          </div>
          <h3 class="text-xl font-bold mb-3">{{ amenity.title }}</h3>
          <p class="text-gray-600">{{ amenity.description }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
