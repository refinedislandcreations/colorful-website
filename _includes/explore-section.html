<section
  id="explore-section"
  class="relative w-screen h-screen overflow-hidden"
>
  <div class="relative w-full h-full">
    <!-- INTRO -->
    <div
      id="explore-intro"
      class="explore-intro absolute inset-0 flex h-screen w-screen flex-col items-center justify-center {{ include.explore_data.intro.bg_color }} px-6 text-center sm:px-12 z-0"
    >
      <div class="max-w-3xl sm:max-w-5xl">
        <h1
          id="explore-intro-text"
          class="text-3xl sm:text-5xl lg:text-6xl uppercase font-extrabold {{ include.explore_data.intro.text_color }} leading-tight montserrat-black"
        >
          {{ include.explore_data.intro.title }}
        </h1>
      </div>
    </div>

    <!-- SLIDES -->
    {% for slide in include.explore_data.slides %}
    <div
      class="explore-slide absolute inset-0 flex h-screen w-screen flex-col items-center justify-center {{ slide.bg_color }} px-6 py-12 text-center sm:px-10 lg:px-16 z-{{ forloop.index | times:10 }}"
      data-slide-index="{{ forloop.index0 }}"
    >
      <div
        class="absolute top-6 left-8 {{ slide.text_color }} text-2xl font-bold"
      >
        {{ slide.number }}
      </div>
      <div class="flex flex-col w-full max-w-7xl mt-8 items-center text-center">
        <h2
          class="explore-h2 text-4xl md:text-6xl font-bold {{ slide.text_color }} mb-6 montserrat-bold"
        >
          {{ slide.title }}
        </h2>
        <a
          href="{{ slide.link_url }}"
          data-hover-img="{{ slide.hover_image }}"
          class="dm-sans-regular {{ slide.text_color }} text-base lg:text-lg relative inline-block font-semibold no-underline after:absolute after:left-0 after:bottom-[-3px] after:h-[2px] after:w-0 after:bg-current after:transition-all after:duration-300 hover:after:w-full explore-link"
        >
          {{ slide.description }}
        </a>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Hover Reveal (scoped to explore-section) -->
  <div
    id="explore-hover"
    class="explore-hover-reveal fixed pointer-events-none z-[99] opacity-0 w-[200px] h-[280px]"
  >
    <div class="explore-hover-reveal__inner overflow-hidden w-full h-full">
      <div
        class="explore-hover-reveal__img w-full h-full bg-cover bg-center"
      ></div>
    </div>
  </div>

  <style>
    /* ✅ Scoped hover image styling */
    #explore-section .explore-hover-reveal {
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      will-change: transform, filter, opacity;
    }
  </style>

  <!-- ✅ Isolated GSAP Script for Explore Section -->
  <script>
    (function () {
      // Wait for DOM and GSAP to be ready
      function initExploreSection() {
        if (
          typeof gsap !== "undefined" &&
          typeof ScrollTrigger !== "undefined" &&
          typeof SplitType !== "undefined"
        ) {
          gsap.registerPlugin(ScrollTrigger);

          const exploreSection = document.getElementById("explore-section");
          if (!exploreSection) return;

          const ctx = gsap.context(() => {
            const slides = Array.from(
              exploreSection.querySelectorAll(".explore-slide")
            );
            const hover = exploreSection.querySelector("#explore-hover");
            const hoverImg = hover.querySelector(".explore-hover-reveal__img");

            // ✅ Start hidden but display:block (not hidden)
            gsap.set(hover, { autoAlpha: 0, xPercent: -50, yPercent: -50 });

            let setX, setY;
            const align = (e) => {
              setX(e.clientX);
              setY(e.clientY);
            };

            const startFollow = () =>
              document.addEventListener("mousemove", align);
            const stopFollow = () =>
              document.removeEventListener("mousemove", align);

            const fade = gsap.to(hover, {
              autoAlpha: 1,
              duration: 0.3,
              paused: true,
              onReverseComplete: stopFollow,
            });

            const scaleTl = gsap.timeline({ paused: true });
            scaleTl.fromTo(
              hover.querySelector(".explore-hover-reveal__inner"),
              { scale: 0.3 },
              { scale: 1, duration: 0.8, ease: "expo.out" }
            );
            scaleTl.fromTo(
              hoverImg,
              { scale: 2 },
              { scale: 1, duration: 0.8, ease: "expo.out" },
              0
            );

            function handleEnter(e, el) {
              const imgSrc = el.getAttribute("data-hover-img");
              if (!imgSrc) return;
              gsap.set(hoverImg, { backgroundImage: `url(${imgSrc})` });

              fade.play();
              startFollow();

              setX = gsap.quickTo(hover, "x", {
                duration: 0.8,
                ease: "expo.out",
              });
              setY = gsap.quickTo(hover, "y", {
                duration: 0.8,
                ease: "expo.out",
              });
              align(e);
              scaleTl.play();
            }

            function handleLeave() {
              fade.reverse();
              scaleTl.timeScale(2).reverse();
            }

            // Attach hover events to explore links only
            exploreSection.querySelectorAll(".explore-link").forEach((a) => {
              a.addEventListener("mouseenter", (e) => handleEnter(e, a));
              a.addEventListener("mouseleave", handleLeave);
            });

            /* --- ScrollTrigger Animations --- */
            const splitIntro = new SplitType("#explore-intro-text", {
              types: "chars",
            });
            gsap.to(splitIntro.chars, {
              scrollTrigger: {
                trigger: "#explore-intro",
                start: "top 80%",
                end: "bottom 60%",
                scrub: 0.6,
              },
              opacity: 1,
              y: 0,
              stagger: 0.015,
              ease: "power3.out",
            });

            slides.forEach((slide) => {
              const h2 = slide.querySelector(".explore-h2");
              const link = slide.querySelector(".explore-link");
              if (h2) {
                const splitH2 = new SplitType(h2, { types: "chars" });
                gsap.to(splitH2.chars, {
                  scrollTrigger: {
                    trigger: slide,
                    start: "top 80%",
                    once: true,
                  },
                  opacity: 1,
                  y: 0,
                  stagger: 0.02,
                  duration: 0.7,
                  ease: "power3.out",
                });
              }
              if (link) {
                const splitLink = new SplitType(link, { types: "chars" });
                gsap.to(splitLink.chars, {
                  scrollTrigger: {
                    trigger: slide,
                    start: "top 80%",
                    once: true,
                  },
                  opacity: 1,
                  y: 0,
                  stagger: 0.02,
                  duration: 0.7,
                  ease: "power3.out",
                  delay: 0.3,
                });
              }
            });

            const stackGap = 60;
            gsap.set(slides, { y: "100%" });
            gsap
              .timeline({
                scrollTrigger: {
                  trigger: exploreSection,
                  pin: true,
                  scrub: 1,
                  start: "top top",
                  end: () => `+=${(slides.length - 1) * window.innerHeight}`,
                  pinSpacing: true,
                  anticipatePin: 1,
                },
              })
              .to(slides, {
                y: (i) => i * stackGap,
                duration: 1,
                ease: "none",
                stagger: 1,
              });
          }, exploreSection);

          // Store context for cleanup if needed
          window.exploreSectionContext = ctx;

          window.addEventListener("resize", () => ScrollTrigger.refresh());
        } else {
          // Retry if GSAP not loaded yet
          setTimeout(initExploreSection, 100);
        }
      }

      // Initialize when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initExploreSection);
      } else {
        initExploreSection();
      }

      // Cleanup function if needed
      window.cleanupExploreAnimations = function () {
        if (window.exploreSectionContext) {
          window.exploreSectionContext.revert();
        }
      };
    })();
  </script>
</section>
