<section
  id="explore-section"
  class="relative w-screen h-screen overflow-hidden bg-gray-100"
>
  <div class="relative w-full h-full">
    <!-- INTRO -->
    <div
      id="explore-intro"
      class="explore-intro absolute inset-0 flex h-screen w-screen flex-col items-center justify-center bg-[#69673a] px-6 text-center sm:px-12 z-0"
    >
      <div class="max-w-3xl sm:max-w-5xl">
        <h1
          id="explore-intro-text"
          class="text-3xl sm:text-5xl lg:text-6xl uppercase font-extrabold text-[#f8efc1] leading-tight montserrat-black"
        >
          Discover experiences that awaken your senses.
        </h1>
      </div>
    </div>

    <!-- SLIDE 1 -->
    <div
      class="explore-slide absolute inset-0 flex h-screen w-screen flex-col items-center justify-center bg-[#d3a642] px-6 py-12 text-center sm:px-10 lg:px-16 z-10"
    >
      <div class="absolute top-6 left-8 text-[#943a21] text-2xl font-bold">
        01
      </div>
      <div class="flex flex-col w-full max-w-7xl mt-8 items-center text-center">
        <h2
          class="explore-h2 text-4xl md:text-6xl font-bold text-[#943a21] mb-6 montserrat-bold"
        >
          Savor Coastal Flavors
        </h2>
        <a
          href="#"
          data-hover-img="/assets/images/sunset-ocean-view-dining.png"
          class="dm-sans-regular text-[#943a21] text-base lg:text-lg relative inline-block font-semibold no-underline after:absolute after:left-0 after:bottom-[-3px] after:h-[2px] after:w-0 after:bg-current after:transition-all after:duration-300 hover:after:w-full"
          >Discover our farm-to-table dining experiences</a
        >
      </div>
    </div>

    <!-- SLIDE 2 -->
    <div
      class="explore-slide absolute inset-0 flex h-screen w-screen flex-col items-center justify-center bg-[#943a21] px-6 py-12 text-center sm:px-10 lg:px-16 z-20"
    >
      <div class="absolute top-6 left-8 text-[#f8efc1] text-2xl font-bold">
        02
      </div>
      <div class="flex flex-col w-full max-w-7xl mt-8 items-center text-center">
        <h2
          class="explore-h2 text-4xl md:text-6xl font-bold text-[#f8efc1] mb-6 montserrat-bold"
        >
          Celebrate Together
        </h2>
        <a
          href="#"
          data-hover-img="/assets/images/tropical-villa-dining-hall.png"
          class="dm-sans-regular text-[#f8efc1] text-base lg:text-lg relative inline-block font-semibold no-underline after:absolute after:left-0 after:bottom-[-3px] after:h-[2px] after:w-0 after:bg-current after:transition-all after:duration-300 hover:after:w-full"
          >Explore intimate gathering spaces</a
        >
      </div>
    </div>
  </div>

 <!-- Hover Reveal (scoped to explore-section) -->
<div
  id="explore-hover"
  class="hover-reveal fixed pointer-events-none z-[99] opacity-0 w-[200px] h-[280px]"
>
  <div class="hover-reveal__inner overflow-hidden w-full h-full">
    <div class="hover-reveal__img w-full h-full bg-cover bg-center"></div>
  </div>
</div>

<style>
  /* ✅ Scoped hover image styling */
  #explore-section .hover-reveal {
    top: 0;
    left: 0;
    transform: translate(-50%, -50%);
    will-change: transform, filter, opacity;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.gsap || !window.ScrollTrigger || !window.SplitType) return;
    gsap.registerPlugin(ScrollTrigger);

    const ctx = gsap.context(() => {
      const section = document.querySelector("#explore-section");
      const slides = Array.from(section.querySelectorAll(".explore-slide"));
      const hover = section.querySelector("#explore-hover");
      const hoverImg = hover.querySelector(".hover-reveal__img");

      // ✅ Start hidden but display:block (not hidden)
      gsap.set(hover, { autoAlpha: 0, xPercent: -50, yPercent: -50 });

      let setX, setY;
      const align = (e) => {
        setX(e.clientX);
        setY(e.clientY);
      };

      const startFollow = () => document.addEventListener("mousemove", align);
      const stopFollow = () => document.removeEventListener("mousemove", align);

      const fade = gsap.to(hover, {
        autoAlpha: 1,
        duration: 0.3,
        paused: true,
        onReverseComplete: stopFollow,
      });

      const scaleTl = gsap.timeline({ paused: true });
      scaleTl.fromTo(
        hover.querySelector(".hover-reveal__inner"),
        { scale: 0.3 },
        { scale: 1, duration: 0.8, ease: "expo.out" }
      );
      scaleTl.fromTo(
        hoverImg,
        { scale: 2 },
        { scale: 1, duration: 0.8, ease: "expo.out" },
        0
      );

      function handleEnter(e, el) {
        const imgSrc = el.getAttribute("data-hover-img");
        if (!imgSrc) return;
        gsap.set(hoverImg, { backgroundImage: `url(${imgSrc})` });

        fade.play();
        startFollow();

        setX = gsap.quickTo(hover, "x", { duration: 0.8, ease: "expo.out" });
        setY = gsap.quickTo(hover, "y", { duration: 0.8, ease: "expo.out" });
        align(e);
        scaleTl.play();
      }

      function handleLeave() {
        fade.reverse();
        scaleTl.timeScale(2).reverse();
      }

      // Attach hover events to <a> tags only
      section.querySelectorAll("a[data-hover-img]").forEach((a) => {
        a.addEventListener("mouseenter", (e) => handleEnter(e, a));
        a.addEventListener("mouseleave", handleLeave);
      });

      /* --- Existing ScrollTrigger Animations (unchanged) --- */
      const splitIntro = new SplitType("#explore-intro-text", { types: "chars" });
      gsap.to(splitIntro.chars, {
        scrollTrigger: {
          trigger: "#explore-intro",
          start: "top 80%",
          end: "bottom 60%",
          scrub: 0.6,
        },
        opacity: 1,
        y: 0,
        stagger: 0.015,
        ease: "power3.out",
      });

      slides.forEach((slide) => {
        const h2 = slide.querySelector(".explore-h2");
        const link = slide.querySelector("a");
        if (h2) {
          const splitH2 = new SplitType(h2, { types: "chars" });
          gsap.to(splitH2.chars, {
            scrollTrigger: { trigger: slide, start: "top 80%", once: true },
            opacity: 1,
            y: 0,
            stagger: 0.02,
            duration: 0.7,
            ease: "power3.out",
          });
        }
        if (link) {
          const splitLink = new SplitType(link, { types: "chars" });
          gsap.to(splitLink.chars, {
            scrollTrigger: { trigger: slide, start: "top 80%", once: true },
            opacity: 1,
            y: 0,
            stagger: 0.02,
            duration: 0.7,
            ease: "power3.out",
            delay: 0.3,
          });
        }
      });

      const stackGap = 60;
      gsap.set(slides, { y: "100%" });
      gsap
        .timeline({
          scrollTrigger: {
            trigger: section,
            pin: true,
            scrub: 1,
            start: "top top",
            end: () => `+=${(slides.length - 1) * window.innerHeight}`,
            pinSpacing: true,
            anticipatePin: 1,
          },
        })
        .to(slides, {
          y: (i) => i * stackGap,
          duration: 1,
          ease: "none",
          stagger: 1,
        });
    }, "#explore-section");

    window.addEventListener("resize", () => ScrollTrigger.refresh());
  });
</script>

</section>
