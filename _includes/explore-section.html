<section
  id="explore-section"
  class="relative w-screen h-screen overflow-hidden bg-gray-100"
>
  <style>
    /* ✅ Scoped only for explore-section */
    #explore-section {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    #explore-section .explore-intro,
    #explore-section .explore-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* ✨ Text Animation Defaults */
    #explore-section .char {
      opacity: 0;
      transform: translateY(30px);
    }

    /* ✨ Link underline animation */
    #explore-section a.slide-link {
      position: relative;
      display: inline-block;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    #explore-section a.slide-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      height: 2px;
      width: 0;
      background-color: currentColor;
      transition: width 0.3s ease;
    }
    #explore-section a.slide-link:hover::after {
      width: 100%;
    }
  </style>

  <div class="relative w-full h-full">
    <!-- INTRO -->
    <div
      id="explore-intro"
      class="explore-intro bg-[#69673a] px-6 sm:px-12 z-0"
    >
      <div class="max-w-3xl sm:max-w-5xl">
        <h1
          id="explore-intro-text"
          class="text-3xl sm:text-5xl lg:text-7xl uppercase font-extrabold text-[#f8efc1] leading-tight montserrat-black"
        >
          Discover experiences that awaken your senses.
        </h1>
      </div>
    </div>

    <!-- SLIDE 1 -->
    <div class="explore-slide bg-[#d3a642] px-6 sm:px-10 lg:px-16 py-12 z-10">
      <div class="absolute top-6 left-8 text-[#943a21] text-2xl font-bold">
        01
      </div>
      <div class="flex flex-col w-full max-w-7xl mt-8">
        <h2
          class="explore-h2 text-4xl md:text-6xl lg:text-9xl font-bold text-[#943a21] mb-6 montserrat-bold"
        >
          Savor Coastal Flavors
        </h2>
        <a href="#" class="dm-sans-regular slide-link text-[#943a21]"
          >Discover our farm-to-table dining experiences</a
        >
      </div>
    </div>

    <!-- SLIDE 2 -->
    <div class="explore-slide bg-[#943a21] px-6 sm:px-10 lg:px-16 py-12 z-20">
      <div class="absolute top-6 left-8 text-[#f8efc1] text-2xl font-bold">
        02
      </div>
      <div class="flex flex-col w-full max-w-7xl mt-8">
        <h2
          class="explore-h2 text-4xl md:text-6xl lg:text-9xl font-bold text-[#f8efc1] mb-6 montserrat-bold"
        >
          Celebrate Together
        </h2>
        <a href="#" class="dm-sans-regular slide-link text-[#f8efc1]"
          >Explore intimate gathering spaces</a
        >
      </div>
    </div>
  </div>

  <!-- ✅ GSAP Script (isolated) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.gsap || !window.ScrollTrigger || !window.SplitType) return;

      gsap.registerPlugin(ScrollTrigger);

      // ✅ Isolate everything inside GSAP context
      const ctx = gsap.context(() => {
        const section = document.querySelector("#explore-section");
        const slides = section.querySelectorAll(".explore-slide");

        // Split intro text
        const splitIntro = new SplitType("#explore-intro-text", {
          types: "chars",
        });
        gsap.to(splitIntro.chars, {
          scrollTrigger: {
            trigger: "#explore-intro",
            start: "top 80%",
            end: "bottom 60%",
            scrub: 0.6,
          },
          opacity: 1,
          y: 0,
          stagger: 0.015,
          ease: "power3.out",
        });

        // Animate each slide content
        slides.forEach((slide) => {
          const h2 = slide.querySelector(".explore-h2");
          const link = slide.querySelector(".slide-link");

          if (h2) {
            const splitH2 = new SplitType(h2, { types: "chars" });
            gsap.to(splitH2.chars, {
              scrollTrigger: {
                trigger: slide,
                start: "top 80%",
                once: true,
              },
              opacity: 1,
              y: 0,
              stagger: 0.02,
              duration: 0.7,
              ease: "power3.out",
            });
          }

          if (link) {
            const splitLink = new SplitType(link, { types: "chars" });
            gsap.to(splitLink.chars, {
              scrollTrigger: {
                trigger: slide,
                start: "top 80%",
                once: true,
              },
              opacity: 1,
              y: 0,
              stagger: 0.02,
              duration: 0.7,
              ease: "power3.out",
              delay: 0.3,
            });
          }
        });

        // Stack scroll animation (no pin conflict)
        const stackGap = 60;
        gsap.set(slides, { y: "100%" });

        gsap
          .timeline({
            scrollTrigger: {
              trigger: section,
              pin: true,
              scrub: 1,
              start: "top top",
              end: () => `+=${(slides.length - 1) * window.innerHeight}`,
              pinSpacing: true, // ✅ Prevent collapsing the next section
              anticipatePin: 1,
            },
          })
          .to(slides, {
            y: (i) => i * stackGap,
            duration: 1,
            ease: "none",
            stagger: 1,
          });
      }, "#explore-section"); // <- isolate context to this section only

      // ✅ Refresh triggers on resize
      window.addEventListener("resize", () => ScrollTrigger.refresh());
    });
  </script>
</section>
