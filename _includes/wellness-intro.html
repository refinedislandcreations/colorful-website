<!-- 🌿 INTRO SECTION -->
<section
  id="wellness-intro-section"
  class="relative flex flex-col items-center justify-center min-h-screen bg-muted-base text-muted-base text-center px-6 overflow-hidden"
>
  <div class="max-w-7xl">
    <h1
      id="wellness-intro-title"
      class="text-muted uppercase leading-tight tracking-tight mb-6 text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl"
    >
      {{ include.intro.title }}
    </h1>
    <p
      id="wellness-intro-subtext"
      class="text-base sm:text-lg md:text-xl font-medium leading-relaxed opacity-0 translate-y-8 text-muted"
    >
      {{ include.intro.subtitle }}
    </p>
  </div>
</section>

<!-- ✅ Isolated GSAP Script for Wellness Intro -->
<script>
  (function () {
    // Wait for DOM and GSAP to be ready
    function initWellnessIntro() {
      if (
        typeof gsap !== "undefined" &&
        typeof ScrollTrigger !== "undefined" &&
        typeof SplitType !== "undefined"
      ) {
        gsap.registerPlugin(ScrollTrigger);

        const wellnessIntroSection = document.getElementById(
          "wellness-intro-section"
        );
        const wellnessIntroTitle = document.getElementById(
          "wellness-intro-title"
        );

        if (!wellnessIntroSection || !wellnessIntroTitle) return;

        const split = new SplitType(wellnessIntroTitle, { types: "words" });

        gsap.set(split.chars, { opacity: 0, y: 50 });

        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: wellnessIntroSection,
            start: "top 85%",
            end: "bottom 60%",
            toggleActions: "play none none reverse",
          },
        });

        tl.to(split.chars, {
          opacity: 1,
          y: 0,
          stagger: 0.02,
          ease: "power3.out",
          duration: 0.8,
        }).to(
          "#wellness-intro-subtext",
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: "power2.out",
          },
          "-=0.3"
        );
      } else {
        // Retry if GSAP not loaded yet
        setTimeout(initWellnessIntro, 100);
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initWellnessIntro);
    } else {
      initWellnessIntro();
    }
  })();
</script>
