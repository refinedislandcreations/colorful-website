<!-- ✅ GSAP + ScrollTrigger + SplitType -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/split-type"></script>

<!-- 🌿 INTRO SECTION -->
<section
  id="intro-section"
  class="relative flex flex-col items-center justify-center min-h-screen bg-[#f8f7f2] text-[#69673a] text-center px-6 overflow-hidden"
>
  <div class="max-w-7xl">
    <h1
      id="intro-title"
      class="font-black uppercase leading-tight tracking-tight mb-6 text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl"
    >
      Restore Balance<br />To Body and Mind
    </h1>
    <p
      id="intro-subtext"
      class="text-base sm:text-lg md:text-xl font-medium leading-relaxed opacity-0 translate-y-8"
    >
      Awaken with the sun in sacred spaces designed for renewal. Our rituals
      draw from ancient traditions and the healing power of nature.
    </p>
  </div>
</section>

<script>
  gsap.registerPlugin(ScrollTrigger);

  document.addEventListener("DOMContentLoaded", () => {
    const split = new SplitType("#intro-title", { types: "chars" });

    gsap.set(split.chars, { opacity: 0, y: 50 });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#intro-section",
        start: "top 85%",
        end: "bottom 60%",
        toggleActions: "play none none reverse",
      },
    });

    tl.to(split.chars, {
      opacity: 1,
      y: 0,
      stagger: 0.02,
      ease: "power3.out",
      duration: 0.8,
    }).to(
      "#intro-subtext",
      {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "power2.out",
      },
      "-=0.3"
    );
  });
</script>
