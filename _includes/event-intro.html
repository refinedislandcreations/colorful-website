<section
  id="event-intro"
  class="relative w-full min-h-screen bg-[#b3cdbd] text-[#69673a] overflow-hidden"
>
  <!-- Background Elements -->
  <div class="absolute inset-0 z-0">
    <div
      class="absolute top-1/4 left-10 w-32 h-32 bg-[#943a21]/10 rounded-full blur-xl"
    ></div>
    <div
      class="absolute bottom-1/3 right-20 w-48 h-48 bg-[#943a21]/5 rounded-full blur-2xl"
    ></div>
  </div>

  <div
    class="relative z-10 grid lg:grid-cols-12 max-w-7xl mx-auto min-h-screen"
  >
    <!-- Text Content - Left Side -->
    <div class="lg:col-span-5 flex items-center py-20 lg:py-0 px-6 lg:px-12">
      <div class="max-w-lg mx-auto lg:mx-0">
        <!-- Decorative Element -->
        <div class="flex items-center mb-8 opacity-0" id="decorative-line">
          <div class="w-12 h-px bg-[#943a21]/30 mr-4"></div>
          <span class="text-sm font-medium tracking-wider text-[#69673a]/60"
            >WELCOME</span
          >
        </div>

        <h1
          class="text-4xl lg:text-6xl font-light mb-8 leading-tight opacity-0"
          id="main-heading"
        >
          Gather,
          <span class="block mt-2">Celebrate,</span>
          <span class="block mt-2">Connect</span>
        </h1>

        <p
          class="text-lg lg:text-xl leading-relaxed text-[#69673a]/90 mb-8 opacity-0"
          id="main-text"
        >
          Amara Isles offers a serene setting for unforgettable occasions — from
          intimate celebrations to elegant gatherings by the sea. Our natural
          spaces invite connection, creativity, and quiet joy.
        </p>

        <!-- CTA Button -->
        <div class="opacity-0" id="cta-button">
          <button
            class="group relative px-8 py-4 bg-transparent border border-[#69673a]/30 rounded-full text-[#69673a] font-medium transition-all duration-500 hover:border-[#69673a]/60 hover:pl-12"
          >
            <span>Explore Events</span>
            <svg
              class="w-5 h-5 ml-2 inline-block opacity-0 group-hover:opacity-100 group-hover:ml-3 transition-all duration-300"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Image Content - Right Side -->
    <div class="lg:col-span-7 relative">
      <div
        class="sticky top-0 h-screen flex items-center justify-center px-6 lg:px-0"
      >
        <!-- Main Image Container -->
        <div
          class="relative w-full h-4/5 max-w-4xl rounded-2xl overflow-hidden shadow-2xl opacity-0"
          id="image-container"
        >
          <img
            src="/assets/images/garden-sanctuary.jpg"
            alt="Luxurious event space at Amara Isles with elegant decor and natural lighting"
            class="w-full h-full object-cover object-center scale-110"
            id="main-image"
          />
          <!-- Image Overlay Gradient -->
          <div
            class="absolute inset-0 bg-gradient-to-r from-[#f8efc1]/20 to-transparent"
          ></div>

          <!-- Floating Info Card -->
          <div
            class="absolute bottom-8 left-8 bg-white/90 backdrop-blur-sm rounded-2xl p-6 max-w-xs shadow-xl opacity-0"
            id="info-card"
          >
            <h3 class="font-semibold text-[#69673a] mb-2">Garden Sanctuary</h3>
            <p class="text-sm text-[#69673a]/70">Capacity: 50 guests</p>
            <p class="text-sm text-[#69673a]/70">Outdoor & Indoor options</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const section = document.querySelector("#event-intro");
      if (!section) return;

      const ctx = gsap.context(() => {
        // Master timeline for coordinated animations
        const masterTL = gsap.timeline({
          scrollTrigger: {
            trigger: section,
            start: "top 80%",
            end: "bottom top",
            toggleActions: "play none none reverse",
          },
        });

        // Text elements sequential animation
        masterTL
          .to("#decorative-line", {
            opacity: 1,
            duration: 0.8,
            ease: "power2.out",
          })
          .to(
            "#main-heading",
            { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" },
            "-=0.4"
          )
          .to(
            "#main-text",
            { opacity: 1, y: 0, duration: 1, ease: "power2.out" },
            "-=0.6"
          )
          .to(
            "#cta-button",
            { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
            "-=0.4"
          );

        // Image container entrance
        gsap.to("#image-container", {
          opacity: 1,
          duration: 1.5,
          ease: "power2.out",
          scrollTrigger: {
            trigger: "#image-container",
            start: "top 85%",
            toggleActions: "play none none reverse",
          },
        });

        // Image scale animation on scroll
        gsap.to("#main-image", {
          scale: 1,
          duration: 1,
          ease: "none",
          scrollTrigger: {
            trigger: section,
            start: "top bottom",
            end: "bottom top",
            scrub: true,
          },
        });

        // Info card animation
        gsap.to("#info-card", {
          opacity: 1,
          y: 0,
          duration: 1,
          delay: 1,
          ease: "power2.out",
          scrollTrigger: {
            trigger: "#image-container",
            start: "top 70%",
            toggleActions: "play none none reverse",
          },
        });

        // Scroll indicator animation
        gsap.to("#scroll-indicator", {
          opacity: 1,
          duration: 1,
          ease: "power2.out",
          scrollTrigger: {
            trigger: section,
            start: "top 90%",
            toggleActions: "play none none reverse",
          },
        });

        // Parallax effect for background elements
        gsap.to(".absolute.inset-0 .absolute", {
          y: (i, target) => (i === 0 ? -100 : 100),
          ease: "none",
          scrollTrigger: {
            trigger: section,
            start: "top bottom",
            end: "bottom top",
            scrub: true,
          },
        });
      }, section);

      return () => ctx.revert();
    })();
  </script>
</section>
