<style>
  /* Navbar - Transparent with white text */
  .nav-container {
    background: transparent;
    backdrop-filter: none;
    box-shadow: none;
    border-bottom: none;
  }

  /* Hamburger Animation */
  .hamburger.active .hamburger-line:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
    background-color: #e6397c;
  }

  .hamburger.active .hamburger-line:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active .hamburger-line:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
    background-color: #e6397c;
  }

  /* Book Now Button - Hide when menu is open */
  .wave-container.open ~ .nav-container .book-now-container {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
  }

  /* Book Now Button - Normal state */
  .book-now-container {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s, visibility 0.3s;
  }

  /* Menu Item Animations */
  .menu-item {
    opacity: 0;
    transform: translateY(20px);
  }

  .wave-container.active .menu-item {
    opacity: 1;
    transform: translateY(0);
  }

  /* Responsive Improvements */
  @media (max-width: 768px) {
    .wave-container .container {
      padding-bottom: 100px;
    }

    .menu-item {
      min-height: 140px;
    }
  }

  /* Hide navbar on scroll down, show on scroll up */
  .nav-container.hidden {
    transform: translateY(-100%);
  }

  .nav-container.visible {
    transform: translateY(0);
  }
</style>

<script>
  // State
  let isOpen = false;
  let lastScrollY = window.scrollY;
  let isNavbarHidden = false;

  // DOM Elements
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const waveContainer = document.getElementById("waveContainer");
  const mobileMenu = document.getElementById("mobileMenu");
  const menuItems = document.querySelectorAll(".menu-item");
  const navContainer = document.querySelector(".nav-container");
  const bookNowContainer = document.querySelector(".book-now-container");

  // Create wave animation timeline
  const waveTimeline = gsap.timeline({
    paused: true,
    onReverseComplete: () => {
      // When reverse animation finishes, close container
      closeContainer();
    },
    onComplete: () => {
      // When wave animation completes, show menu with staggered items
      showMenuItems();
    },
  });

  // Set initial positions for waves (starting off-screen at top)
  gsap.set("#wave", { y: -1200, x: -1600 });
  gsap.set("#wave2", { y: -1200, x: 1600 });

  // REVERSED Wave animations - waves now move from top to bottom
  waveTimeline
    .to("#wave", {
      duration: 1.5,
      x: 0, // End at original position
      y: 0, // End at original position
      ease: "power2.inOut",
    })
    .to(
      "#wave2",
      {
        duration: 1.5,
        x: 0, // End at original position
        y: 0, // End at original position
        ease: "power2.inOut",
      },
      0
    );

  // Function to show menu items with staggered animation
  function showMenuItems() {
    // Hide Book Now button in navbar when menu opens
    if (bookNowContainer) {
      bookNowContainer.style.opacity = "0";
      bookNowContainer.style.visibility = "hidden";
    }

    // Add open class to wave container
    waveContainer.classList.add("open");

    // First show the menu container
    gsap.to(mobileMenu, {
      duration: 0.3,
      opacity: 1,
      y: 0,
      ease: "power2.out",
      onComplete: () => {
        mobileMenu.classList.add("active");

        // Then animate each menu item with a staggered effect
        gsap.to(menuItems, {
          duration: 0.5,
          opacity: 1,
          y: 0,
          stagger: 0.08,
          ease: "back.out(1.7)",
        });
      },
    });
  }

  // Function to hide menu items with staggered animation
  function hideMenuItems() {
    // Show Book Now button in navbar when menu closes
    if (bookNowContainer) {
      bookNowContainer.style.opacity = "1";
      bookNowContainer.style.visibility = "visible";
    }

    // Remove open class from wave container
    waveContainer.classList.remove("open");

    // First hide menu items in reverse order
    gsap.to(menuItems, {
      duration: 0.3,
      opacity: 0,
      y: 20,
      stagger: 0.05,
      ease: "power2.in",
      onComplete: () => {
        // Then hide the menu container
        gsap.to(mobileMenu, {
          duration: 0.2,
          opacity: 0,
          y: -20,
          ease: "power2.in",
          onComplete: () => {
            mobileMenu.classList.remove("active");
          },
        });
      },
    });
  }

  // Container open/close animations
  const openContainer = () => {
    gsap.to(waveContainer, {
      duration: 0.5,
      height: "100vh",
      opacity: 1,
      y: 0,
      ease: "power2.out",
      onStart: () => {
        // Show navbar when menu opens
        navContainer.classList.remove("hidden");
        navContainer.classList.add("visible");
      },
      onComplete: () => {
        // Prevent body scrolling when menu is open
        document.body.style.overflow = "hidden";
      },
    });
  };

  const closeContainer = () => {
    gsap.to(waveContainer, {
      duration: 0.4,
      height: "0px",
      opacity: 0,
      y: -50,
      ease: "power2.in",
      onComplete: () => {
        // Re-enable body scrolling when menu is closed
        document.body.style.overflow = "auto";
      },
    });
  };

  // Hamburger click handler
  hamburgerBtn.addEventListener("click", () => {
    if (!isOpen) {
      // Open container and play animation forward (top to bottom)
      hamburgerBtn.classList.add("active");
      openContainer();
      waveTimeline.play();
      isOpen = true;
    } else {
      // First hide menu items, then reverse wave animation
      hideMenuItems();

      // Add a delay before reversing the wave animation
      setTimeout(() => {
        waveTimeline.reverse();
        hamburgerBtn.classList.remove("active");
        isOpen = false;
      }, 300); // Match this delay with the hideMenuItems duration
    }
  });

  // Close menu when clicking on a menu link
  const menuLinks = document.querySelectorAll("#mobileMenu a");
  menuLinks.forEach((link) => {
    link.addEventListener("click", () => {
      // First hide menu items, then reverse wave animation
      hideMenuItems();

      setTimeout(() => {
        waveTimeline.reverse();
        hamburgerBtn.classList.remove("active");
        isOpen = false;
      }, 300);
    });
  });

  // Close menu when clicking the Book Now button in menu
  const mobileBookNowBtn = document.querySelector("#mobileMenu button");
  if (mobileBookNowBtn) {
    mobileBookNowBtn.addEventListener("click", () => {
      hideMenuItems();

      setTimeout(() => {
        waveTimeline.reverse();
        hamburgerBtn.classList.remove("active");
        isOpen = false;
      }, 300);
    });
  }

  // Close menu when clicking outside on mobile
  waveContainer.addEventListener("click", (e) => {
    if (e.target === waveContainer || e.target.closest("svg")) {
      hideMenuItems();

      setTimeout(() => {
        waveTimeline.reverse();
        hamburgerBtn.classList.remove("active");
        isOpen = false;
      }, 300);
    }
  });

  // Set initial container height
  gsap.set(waveContainer, { height: "0px" });

  // Set initial state for menu items
  gsap.set(menuItems, { opacity: 0, y: 20 });

  // Set initial state for mobile menu
  gsap.set(mobileMenu, { opacity: 0, y: -20 });

  // Scroll hide/show functionality
  function handleScroll() {
    const currentScrollY = window.scrollY;

    // Don't hide navbar if menu is open
    if (isOpen) return;

    // Hide navbar when scrolling down, show when scrolling up
    if (currentScrollY > lastScrollY && currentScrollY > 100) {
      // Scrolling down
      if (!isNavbarHidden) {
        navContainer.classList.add("hidden");
        navContainer.classList.remove("visible");
        isNavbarHidden = true;
      }
    } else if (currentScrollY < lastScrollY) {
      // Scrolling up
      if (isNavbarHidden) {
        navContainer.classList.remove("hidden");
        navContainer.classList.add("visible");
        isNavbarHidden = false;
      }
    }

    lastScrollY = currentScrollY;
  }

  // Throttle scroll events for better performance
  let scrollTimeout;
  window.addEventListener("scroll", () => {
    if (!scrollTimeout) {
      scrollTimeout = setTimeout(() => {
        handleScroll();
        scrollTimeout = null;
      }, 100);
    }
  });

  // Show navbar on page load
  window.addEventListener("load", () => {
    navContainer.classList.add("visible");
  });
</script>
