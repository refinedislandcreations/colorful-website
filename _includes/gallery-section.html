<!-- _includes/gallery-section.html -->
<section
  class="relative py-12 sm:py-16 md:py-20 lg:py-24 bg-[#EEC1DC] overflow-hidden"
>
  <!-- Background accents - responsive sizing -->
  <!-- <div
    class="absolute -top-20 -right-20 w-40 h-40 sm:w-60 sm:h-60 md:w-80 md:h-80 bg-pink-50 rounded-full blur-xl sm:blur-2xl md:blur-3xl"
  ></div>
  <div
    class="absolute -bottom-20 -left-20 w-40 h-40 sm:w-60 sm:h-60 md:w-80 md:h-80 bg-orange-50 rounded-full blur-xl sm:blur-2xl md:blur-3xl"
  ></div> -->

  <div class="container mx-auto px-4 sm:px-6 relative z-10">
    <!-- Gallery Grid - Responsive layout -->
    <div
      class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8 md:gap-10 lg:gap-12 items-center"
    >
      <!-- Image 1 - Responsive rounded styles -->
      <div
        class="relative group opacity-0 translate-y-5 md:translate-y-0 transition-all duration-700 ease-out hover:-translate-y-2"
      >
        <div
          class="overflow-hidden rounded-none sm:rounded-r-lg md:rounded-r-2xl lg:rounded-r-full"
        >
          <img
            src="{{ include.section.images[0].src }}"
            alt="{{ include.section.images[0].alt }}"
            class="w-full h-[220px] xs:h-[250px] sm:h-[320px] md:h-[350px] lg:h-[400px] xl:h-[450px] 2xl:h-[500px] object-cover transform group-hover:scale-105 sm:group-hover:scale-110 transition-all duration-700 ease-out will-change-transform"
            loading="lazy"
          />
        </div>
        <div
          class="absolute inset-0 bg-gradient-to-r from-black/5 to-transparent rounded-none sm:rounded-r-lg md:rounded-r-2xl lg:rounded-r-full"
        ></div>
      </div>

      <!-- Image 2 - Responsive rounded styles -->
      <div
        class="relative group opacity-0 translate-y-5 md:translate-y-0 transition-all duration-700 ease-out hover:-translate-y-2 delay-100"
      >
        <div
          class="overflow-hidden rounded-none sm:rounded-lg md:rounded-2xl lg:rounded-full"
        >
          <img
            src="{{ include.section.images[1].src }}"
            alt="{{ include.section.images[1].alt }}"
            class="w-full h-[220px] xs:h-[250px] sm:h-[320px] md:h-[350px] lg:h-[400px] xl:h-[450px] 2xl:h-[500px] object-cover transform group-hover:scale-105 sm:group-hover:scale-110 transition-all duration-700 ease-out will-change-transform"
            loading="lazy"
          />
        </div>
        <div
          class="absolute inset-0 bg-gradient-to-b from-transparent to-black/5 rounded-none sm:rounded-lg md:rounded-2xl lg:rounded-full"
        ></div>
      </div>

      <!-- Image 3 - Responsive rounded styles -->
      <div
        class="relative group opacity-0 translate-y-5 md:translate-y-0 transition-all duration-700 ease-out hover:-translate-y-2 delay-200"
      >
        <div
          class="overflow-hidden rounded-none sm:rounded-l-lg md:rounded-l-2xl lg:rounded-l-full"
        >
          <img
            src="{{ include.section.images[2].src }}"
            alt="{{ include.section.images[2].alt }}"
            class="w-full h-[220px] xs:h-[250px] sm:h-[320px] md:h-[350px] lg:h-[400px] xl:h-[450px] 2xl:h-[500px] object-cover transform group-hover:scale-105 sm:group-hover:scale-110 transition-all duration-700 ease-out will-change-transform"
            loading="lazy"
          />
        </div>
        <div
          class="absolute inset-0 bg-gradient-to-l from-black/5 to-transparent rounded-none sm:rounded-l-lg md:rounded-l-2xl lg:rounded-l-full"
        ></div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Check for reduced motion preference
    const prefersReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    if (!prefersReducedMotion) {
      // Add intersection observer for fade-in animation
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "50px",
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.remove("opacity-0", "translate-y-5");
            entry.target.classList.add("opacity-100", "translate-y-0");
          }
        });
      }, observerOptions);

      document.querySelectorAll(".group").forEach((el) => observer.observe(el));
    } else {
      // For users with reduced motion preference, show images immediately
      document.querySelectorAll(".group").forEach((el) => {
        el.classList.remove("opacity-0", "translate-y-5");
        el.classList.add("opacity-100", "translate-y-0");
      });
    }

    // Handle print styles with Tailwind classes
    const style = document.createElement("style");
    style.textContent = `
      @media print {
        .group {
          break-inside: avoid !important;
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        .group img {
          height: 300px !important;
          filter: grayscale(100%) !important;
        }
        .bg-pink-50,
        .bg-orange-50 {
          display: none !important;
        }
      }
    `;
    document.head.appendChild(style);
  });
</script>
