<!-- _includes/gallery-section.html -->
<section
  class="relative bg-[#EEC1DC] h-[80vh] md:h-[100vh] overflow-hidden"
  id="gallery-section"
>
  <!-- Images Container -->
  <div class="absolute inset-0 z-10">
    <div class="container mx-auto px-4 h-full flex items-center">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-6 w-full">
        <!-- Image 1 -->
        <div
          class="relative h-[180px] sm:h-[250px] md:h-[350px] lg:h-[450px] overflow-hidden rounded-r-lg md:rounded-r-full"
          id="gallery-image-1"
        >
          <img
            src="{{ include.section.images[0].src }}"
            alt="{{ include.section.images[0].alt }}"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </div>

        <!-- Image 2 -->
        <div
          class="relative h-[180px] sm:h-[250px] md:h-[350px] lg:h-[450px] overflow-hidden rounded-lg md:rounded-full"
          id="gallery-image-2"
        >
          <img
            src="{{ include.section.images[1].src }}"
            alt="{{ include.section.images[1].alt }}"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </div>

        <!-- Image 3 -->
        <div
          class="relative h-[180px] sm:h-[250px] md:h-[350px] lg:h-[450px] overflow-hidden rounded-l-lg md:rounded-l-full"
          id="gallery-image-3"
        >
          <img
            src="{{ include.section.images[2].src }}"
            alt="{{ include.section.images[2].alt }}"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- CTA Text Container -->
  <div class="relative z-20 h-full flex items-center justify-center">
    <div class="container mx-auto px-4 text-center">
      <div class="opacity-0" id="gallery-cta">
        <h2
          class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-gray-900 mb-4"
        >
          CLOUDORA HOTEL
        </h2>
        <p
          class="text-base sm:text-lg md:text-xl text-gray-700 max-w-md md:max-w-xl mx-auto px-4 mb-6"
        >
          A place to stay. Simple. Clean. Quiet.
        </p>
        <div>
          <a
            href="#contact"
            class="inline-block bg-gray-900 hover:bg-gray-800 text-white font-medium py-2 px-6 md:py-3 md:px-8 text-sm md:text-base rounded-full transition-colors duration-300"
          >
            Book Your Stay
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof gsap === "undefined" || typeof ScrollTrigger === "undefined") {
      document.getElementById("gallery-cta").classList.remove("opacity-0");
      return;
    }

    gsap.registerPlugin(ScrollTrigger);

    const prefersReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    if (prefersReducedMotion) {
      gsap.set("#gallery-cta", { opacity: 1 });
      return;
    }

    function getDistance() {
      return window.innerWidth < 768
        ? { x: "120vw", y: "120vh" }
        : { x: "80vw", y: "80vh" };
    }

    let tl;

    function initAnimation() {
      if (tl) tl.kill();

      const { x, y } = getDistance();

      // ONE timeline, ONE ScrollTrigger
      tl = gsap.timeline({
        scrollTrigger: {
          trigger: "#gallery-section",
          start: "top 20%",
          end: "top -20%",
          scrub: 0.3,
          invalidateOnRefresh: true,
        },
      });

      // ALL IMAGES MOVE TOGETHER
      tl.to(
        "#gallery-image-1",
        {
          x: `-${x}`,
          opacity: 0,
          rotation: -10,
          ease: "power2.out",
        },
        0.15
      )

        .to(
          "#gallery-image-2",
          {
            y: `-${y}`,
            opacity: 0,
            ease: "power2.out",
          },
          0.15
        )

        .to(
          "#gallery-image-3",
          {
            x: x,
            opacity: 0,
            rotation: 10,
            ease: "power2.out",
          },
          0.15
        )

        // CTA appears after images are mostly gone
        .to(
          "#gallery-cta",
          {
            opacity: 1,
            y: 0,
            scale: 1,
            ease: "power2.out",
          },
          0.6
        );
    }

    initAnimation();

    window.addEventListener("resize", () => {
      ScrollTrigger.refresh();
      initAnimation();
    });
  });
</script>
