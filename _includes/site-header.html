<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  (function () {
    "use strict";

    const menuTrigger = document.getElementById("amara-mobile-menu-trigger");
    const closeButtonWrapper = document.getElementById(
      "amara-close-menu-wrapper"
    );
    const menuOverlay = document.getElementById("amara-mobile-menu-overlay");
    const menuCircle = document.getElementById("amara-menu-circle");
    const menuBackground = document.getElementById("amara-menu-background");
    const menuContent = document.getElementById("amara-menu-content");
    const closeLine1 = document.getElementById("close-line-1");
    const closeLine2 = document.getElementById("close-line-2");
    const menuLinks = menuContent ? [...menuContent.querySelectorAll("a")] : [];

    if (
      !menuTrigger ||
      !menuOverlay ||
      !menuCircle ||
      !menuContent ||
      !closeButtonWrapper ||
      !closeLine1 ||
      !closeLine2
    ) {
      console.warn("Amara Isles navbar elements not found");
      return;
    }

    function getTriggerCenter() {
      const rect = menuTrigger.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2,
      };
    }

    function getCircleDiameter() {
      return Math.sqrt(window.innerWidth ** 2 + window.innerHeight ** 2) * 2;
    }

    function initMenu() {
      const center = getTriggerCenter();
      const diameter = getCircleDiameter();

      gsap.set(menuCircle, {
        width: diameter,
        height: diameter,
        x: center.x - diameter / 2,
        y: center.y - diameter / 2,
        scale: 0,
        transformOrigin: "50% 50%",
      });

      gsap.set([closeLine1, closeLine2], {
        width: 0,
        opacity: 0,
        transformOrigin: "center center",
      });

      gsap.set(closeButtonWrapper, { opacity: 0, pointerEvents: "none" });
      gsap.set(menuBackground, { opacity: 0 });
      gsap.set(menuContent, { opacity: 0, pointerEvents: "none" });
      gsap.set(menuTrigger, { opacity: 1, pointerEvents: "auto" });
      gsap.set(menuOverlay, { pointerEvents: "none" });

      menuLinks.forEach((link) => {
        gsap.set(link, { opacity: 0, y: 40, scale: 0.95 });
      });
    }

    function openMenu() {
      const center = getTriggerCenter();
      const diameter = getCircleDiameter();

      gsap.set(menuCircle, {
        width: diameter,
        height: diameter,
        x: center.x - diameter / 2,
        y: center.y - diameter / 2,
      });

      gsap.set(menuOverlay, { pointerEvents: "auto" });

      const tl = gsap.timeline();
      tl.to(menuTrigger, {
        opacity: 0,
        pointerEvents: "none",
        duration: 0.3,
        ease: "power2.in",
      })
        .to(
          menuCircle,
          {
            scale: 1,
            duration: 0.7,
            ease: "expo.out",
          },
          "-=0.3"
        )
        .to(
          menuBackground,
          {
            opacity: 0.95,
            duration: 0.4,
            ease: "power2.out",
          },
          "-=0.5"
        )
        .to(
          closeButtonWrapper,
          {
            opacity: 1,
            pointerEvents: "auto", // <-- enable pointer events here
            duration: 0.4,
            ease: "power2.out",
          },
          "-=0.4"
        )
        .to(
          [closeLine1, closeLine2],
          {
            width: 32,
            opacity: 1,
            duration: 0.3,
            ease: "power2.out",
            stagger: 0.1,
          },
          "-=0.3"
        )
        .to(
          menuContent,
          {
            opacity: 1,
            pointerEvents: "auto",
            duration: 0.5,
            ease: "power2.out",
          },
          "-=0.3"
        )
        .to(
          menuLinks,
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.6,
            stagger: 0.12,
            ease: "power3.out",
          },
          "-=0.4"
        );
    }

    function closeMenu() {
      const center = getTriggerCenter();
      const diameter = getCircleDiameter();

      const tl = gsap.timeline();
      tl.to(menuLinks, {
        opacity: 0,
        y: 40,
        scale: 0.95,
        duration: 0.25,
        stagger: 0.1,
        ease: "power2.in",
      })
        .to(
          menuContent,
          {
            opacity: 0,
            pointerEvents: "none",
            duration: 0.3,
            ease: "power2.in",
          },
          "-=0.15"
        )
        .to(
          [closeLine1, closeLine2],
          {
            width: 0,
            opacity: 0,
            duration: 0.25,
            ease: "power2.in",
            stagger: 0.1,
          },
          "-=0.2"
        )
        .to(
          closeButtonWrapper,
          {
            opacity: 0,
            pointerEvents: "none", // disable pointer events on close button wrapper
            duration: 0.3,
            ease: "power2.in",
          },
          "-=0.2"
        )
        .to(
          menuBackground,
          {
            opacity: 0,
            duration: 0.4,
            ease: "power2.in",
          },
          "-=0.3"
        )
        .to(
          menuCircle,
          {
            scale: 0,
            duration: 0.8,
            ease: "expo.in",
            x: center.x - diameter / 2,
            y: center.y - diameter / 2,
          },
          "-=0.6"
        )
        .to(
          menuTrigger,
          {
            opacity: 1,
            pointerEvents: "auto",
            duration: 0.3,
            ease: "power2.out",
          },
          "-=0.5"
        )
        .set(menuOverlay, { pointerEvents: "none" });
    }

    // Initialize menu state
    initMenu();

    // Event Listeners
    menuTrigger.addEventListener("click", () => {
      console.log("Menu trigger clicked");
      openMenu();
    });

    closeButtonWrapper.addEventListener("click", () => {
      console.log("Close button wrapper clicked");
      closeMenu();
    });

    menuBackground.addEventListener("click", () => {
      console.log("Menu background clicked");
      closeMenu();
    });

    menuLinks.forEach((link) =>
      link.addEventListener("click", () => {
        console.log("Menu link clicked");
        closeMenu();
      })
    );

    window.addEventListener("resize", () => {
      const circleScale = gsap.getProperty(menuCircle, "scale");
      if (circleScale > 0) {
        const center = getTriggerCenter();
        const diameter = getCircleDiameter();
        gsap.set(menuCircle, {
          width: diameter,
          height: diameter,
          x: center.x - diameter / 2,
          y: center.y - diameter / 2,
        });
      }
    });
  })();
</script>
