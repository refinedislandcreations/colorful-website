<style>
  nav#amara-navbar {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  nav#amara-navbar.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Fixed close button styles */
  #amara-close-menu {
    position: fixed;
    top: 2rem;
    right: 2rem;
    z-index: 100;
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background-color: rgba(148, 58, 33, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: background-color 0.3s ease;
  }

  #amara-close-menu:hover {
    background-color: rgba(148, 58, 33, 0.9);
  }

  #amara-close-menu .close-icon {
    position: relative;
    width: 1.5rem;
    height: 1.5rem;
  }

  #amara-close-menu .close-line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: #f8efc1;
    transform-origin: center;
  }

  /* Initial state - lines are separated */
  #amara-close-menu .close-line-1 {
    transform: translateY(-6px) rotate(0deg);
    opacity: 0;
  }

  #amara-close-menu .close-line-2 {
    transform: translateY(6px) rotate(0deg);
    opacity: 0;
  }

  /* Animated state - lines form X */
  #amara-close-menu.animated .close-line-1 {
    transform: translateY(0) rotate(45deg);
    opacity: 1;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      opacity 0.3s ease;
  }

  #amara-close-menu.animated .close-line-2 {
    transform: translateY(0) rotate(-45deg);
    opacity: 1;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      opacity 0.3s ease;
  }
</style>

<!-- Navbar Component -->
<nav id="amara-navbar" class="w-full text-[#f8efc1] fixed top-0 left-0 z-50">
  <!-- Mobile Navigation -->
  <div class="lg:hidden flex items-center justify-between py-6 px-6">
    <!-- Mobile Logo -->
    <div class="montserrat-bold text-lg tracking-wide">
      <a href="#" class="hover:opacity-80 transition-opacity duration-300"
        >AMARA ISLES</a
      >
    </div>

    <!-- Mobile Menu Trigger -->
    <button
      id="amara-mobile-menu-trigger"
      class="flex items-center space-x-2 dm-sans-medium text-lg hover:opacity-80 transition-opacity duration-300 relative z-50"
    >
      <span>Menu</span>
      <div class="w-6 h-5 relative flex flex-col justify-between">
        <span
          class="w-full h-0.5 bg-[#f8efc1] transition-all duration-300"
        ></span>
        <span
          class="w-full h-0.5 bg-[#f8efc1] transition-all duration-300"
        ></span>
        <span
          class="w-[80%] h-0.5 bg-[#f8efc1] transition-all duration-300"
        ></span>
      </div>
    </button>
  </div>

  <!-- Mobile Menu Overlay -->
  <div
    id="amara-mobile-menu-overlay"
    class="fixed inset-0 z-40 pointer-events-none"
  >
    <!-- Full Screen Background -->
    <div
      id="amara-menu-background"
      class="absolute inset-0 opacity-0 bg-black"
    ></div>

    <!-- Circular Background -->
    <div
      id="amara-menu-circle"
      class="absolute bg-[#943a21] rounded-full transform scale-0 origin-center"
    ></div>

    <!-- Fixed Close Button - No wrapper needed -->
    <button id="amara-close-menu" aria-label="Close menu">
      <div class="close-icon">
        <span class="close-line close-line-1"></span>
        <span class="close-line close-line-2"></span>
      </div>
    </button>

    <!-- Menu Content -->
    <div
      class="h-full flex flex-col justify-center items-center text-white px-8 relative z-50 pointer-events-none opacity-0"
      id="amara-menu-content"
    >
      <div class="flex flex-col items-center space-y-8">
        <a
          href="#"
          class="dm-sans-bold text-xl md:text-4xl transition-all duration-300 hover:opacity-80 hover:scale-105 pointer-events-auto text-[#f8efc1] hover:text-white relative inline-block after:absolute after:bottom-0 after:left-0 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-300 hover:after:w-full"
        >
          Accommodations
        </a>

        <a
          href="#"
          class="dm-sans-bold text-xl md:text-4xl transition-all duration-300 hover:opacity-80 hover:scale-105 pointer-events-auto text-[#f8efc1] hover:text-white relative inline-block after:absolute after:bottom-0 after:left-0 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-300 hover:after:w-full"
        >
          Experiences
        </a>
        <a
          href="#"
          class="dm-sans-bold text-xl md:text-4xl transition-all duration-300 hover:opacity-80 hover:scale-105 pointer-events-auto text-[#f8efc1] hover:text-white relative inline-block after:absolute after:bottom-0 after:left-0 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-300 hover:after:w-full"
        >
          Dining
        </a>
        <a
          href="#"
          class="dm-sans-bold text-xl md:text-4xl transition-all duration-300 hover:opacity-80 hover:scale-105 pointer-events-auto text-[#f8efc1] hover:text-white relative inline-block after:absolute after:bottom-0 after:left-0 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-300 hover:after:w-full"
        >
          Contact
        </a>
        <a
          href="#"
          class="dm-sans-bold text-xl md:text-4xl transition-all duration-300 hover:opacity-80 hover:scale-105 pointer-events-auto text-[#f8efc1] hover:text-white relative inline-block after:absolute after:bottom-0 after:left-0 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-300 hover:after:w-full"
        >
          Book Now
        </a>
      </div>
    </div>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  (function () {
    "use strict";

    const menuTrigger = document.getElementById("amara-mobile-menu-trigger");
    const closeButton = document.getElementById("amara-close-menu");
    const menuOverlay = document.getElementById("amara-mobile-menu-overlay");
    const menuCircle = document.getElementById("amara-menu-circle");
    const menuBackground = document.getElementById("amara-menu-background");
    const menuContent = document.getElementById("amara-menu-content");
    const menuLinks = menuContent ? [...menuContent.querySelectorAll("a")] : [];

    if (
      !menuTrigger ||
      !menuOverlay ||
      !menuCircle ||
      !menuContent ||
      !closeButton
    ) {
      console.warn("Amara Isles navbar elements not found");
      return;
    }

    function getTriggerCenter() {
      const rect = menuTrigger.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2,
      };
    }

    function getCircleDiameter() {
      return Math.sqrt(window.innerWidth ** 2 + window.innerHeight ** 2) * 2;
    }

    function initMenu() {
      const center = getTriggerCenter();
      const diameter = getCircleDiameter();

      gsap.set(menuCircle, {
        width: diameter,
        height: diameter,
        x: center.x - diameter / 2,
        y: center.y - diameter / 2,
        scale: 0,
        transformOrigin: "50% 50%",
      });

      gsap.set(closeButton, {
        opacity: 0,
        pointerEvents: "none",
      });

      // Remove animated class on init
      closeButton.classList.remove("animated");

      gsap.set(menuBackground, { opacity: 0 });
      gsap.set(menuContent, { opacity: 0, pointerEvents: "none" });
      gsap.set(menuTrigger, { opacity: 1, pointerEvents: "auto" });
      gsap.set(menuOverlay, { pointerEvents: "none" });

      menuLinks.forEach((link) => {
        gsap.set(link, { opacity: 0, y: 40, scale: 0.95 });
      });
    }

    function openMenu() {
      const center = getTriggerCenter();
      const diameter = getCircleDiameter();

      gsap.set(menuCircle, {
        width: diameter,
        height: diameter,
        x: center.x - diameter / 2,
        y: center.y - diameter / 2,
      });

      gsap.set(menuOverlay, { pointerEvents: "auto" });

      const tl = gsap.timeline();
      tl.to(menuTrigger, {
        opacity: 0,
        pointerEvents: "none",
        duration: 0.3,
        ease: "power2.in",
      })
        .to(
          menuCircle,
          {
            scale: 1,
            duration: 0.7,
            ease: "expo.out",
          },
          "-=0.3"
        )
        .to(
          menuBackground,
          {
            opacity: 0.95,
            duration: 0.4,
            ease: "power2.out",
          },
          "-=0.5"
        )
        .to(
          closeButton,
          {
            opacity: 1,
            pointerEvents: "auto",
            duration: 0.4,
            ease: "power2.out",
            onComplete: function () {
              // Add animated class to trigger the X animation
              closeButton.classList.add("animated");
            },
          },
          "-=0.4"
        )
        .to(
          menuContent,
          {
            opacity: 1,
            pointerEvents: "auto",
            duration: 0.5,
            ease: "power2.out",
          },
          "-=0.3"
        )
        .to(
          menuLinks,
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.6,
            stagger: 0.12,
            ease: "power3.out",
          },
          "-=0.4"
        );
    }

    function closeMenu() {
      const center = getTriggerCenter();
      const diameter = getCircleDiameter();

      // Remove animated class first to reset animation
      closeButton.classList.remove("animated");

      const tl = gsap.timeline();
      tl.to(menuLinks, {
        opacity: 0,
        y: 40,
        scale: 0.95,
        duration: 0.25,
        stagger: 0.1,
        ease: "power2.in",
      })
        .to(
          menuContent,
          {
            opacity: 0,
            pointerEvents: "none",
            duration: 0.3,
            ease: "power2.in",
          },
          "-=0.15"
        )
        .to(
          closeButton,
          {
            opacity: 0,
            pointerEvents: "none",
            duration: 0.3,
            ease: "power2.in",
          },
          "-=0.2"
        )
        .to(
          menuBackground,
          {
            opacity: 0,
            duration: 0.4,
            ease: "power2.in",
          },
          "-=0.3"
        )
        .to(
          menuCircle,
          {
            scale: 0,
            duration: 0.8,
            ease: "expo.in",
            x: center.x - diameter / 2,
            y: center.y - diameter / 2,
          },
          "-=0.6"
        )
        .to(
          menuTrigger,
          {
            opacity: 1,
            pointerEvents: "auto",
            duration: 0.3,
            ease: "power2.out",
          },
          "-=0.5"
        )
        .set(menuOverlay, { pointerEvents: "none" });
    }

    // Initialize menu state
    initMenu();

    // Event Listeners
    menuTrigger.addEventListener("click", () => {
      console.log("Menu trigger clicked");
      openMenu();
    });

    closeButton.addEventListener("click", (e) => {
      e.stopPropagation(); // Prevent event bubbling
      console.log("Close button clicked");
      closeMenu();
    });

    menuBackground.addEventListener("click", () => {
      console.log("Menu background clicked");
      closeMenu();
    });

    menuLinks.forEach((link) =>
      link.addEventListener("click", () => {
        console.log("Menu link clicked");
        closeMenu();
      })
    );

    window.addEventListener("resize", () => {
      const circleScale = gsap.getProperty(menuCircle, "scale");
      if (circleScale > 0) {
        const center = getTriggerCenter();
        const diameter = getCircleDiameter();
        gsap.set(menuCircle, {
          width: diameter,
          height: diameter,
          x: center.x - diameter / 2,
          y: center.y - diameter / 2,
        });
      }
    });
  })();
</script>
