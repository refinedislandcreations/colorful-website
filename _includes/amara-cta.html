<section
  id="cta-section"
  class="relative w-screen h-screen flex items-center justify-center bg-[#943a21] text-[#f8efc1] overflow-hidden"
>
  <style>
    /* ✅ Scoped styles */
    #cta-section .cta-content {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #cta-section .cta-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #cta-section a.cta-button {
      border: 1px solid #f8efc1;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      transition: all 0.4s ease;
    }

    #cta-section a.cta-button:hover {
      background-color: #f8efc1;
      color: #943a21;
      transform: scale(1.05);
    }
  </style>

  <div class="cta-content text-center max-w-3xl px-6">
    <h2
      class="text-3xl md:text-5xl font-light mb-6 tracking-wide montserrat-bold"
    >
      Escape to Tranquility
    </h2>
    <p class="text-base md:text-lg mb-8 leading-relaxed dm-sans-regular">
      Experience the balance of serenity and indulgence at Amara Isles. Your
      private retreat awaits.
    </p>
    <a
      href="#book"
      class="cta-button inline-block text-base md:text-lg dm-sans-regular"
    >
      Book Your Stay
    </a>
  </div>

  <script>
    // ✅ Scoped GSAP animation
    document.addEventListener("DOMContentLoaded", () => {
      const section = document.querySelector("#cta-section");
      const content = section.querySelector(".cta-content");

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              content.classList.add("visible");
              gsap.fromTo(
                content,
                { opacity: 0, y: 40 },
                {
                  opacity: 1,
                  y: 0,
                  duration: 1.2,
                  ease: "power3.out",
                }
              );
              observer.unobserve(section);
            }
          });
        },
        { threshold: 0.3 }
      );

      observer.observe(section);
    });
  </script>
</section>
