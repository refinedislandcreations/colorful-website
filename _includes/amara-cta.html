<section
  id="cta-section"
  class="relative w-screen h-screen flex items-center justify-center {{ include.cta_data.bg_color }} {{ include.cta_data.text_color }} overflow-hidden"
>
  <style>
    /* ✅ Scoped styles for CTA section */
    #cta-section .cta-content {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #cta-section .cta-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #cta-section .cta-button {
      border: 1px solid {{ include.cta_data.button.border_color }};
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      transition: all 0.4s ease;
    }

    #cta-section .cta-button:hover {
      background-color: {{ include.cta_data.button.hover_bg }};
      color: {{ include.cta_data.button.hover_text }};
      transform: scale(1.05);
    }
  </style>

  <div class="cta-content text-center max-w-3xl px-6">
    <h2
      class="text-3xl md:text-5xl font-light mb-6 tracking-wide montserrat-bold"
    >
      {{ include.cta_data.title }}
    </h2>
    <p class="text-base md:text-lg mb-8 leading-relaxed dm-sans-regular">
      {{ include.cta_data.description }}
    </p>
    <a
      href="{{ include.cta_data.button.url }}"
      class="cta-button inline-block text-base md:text-lg dm-sans-regular"
    >
      {{ include.cta_data.button.text }}
    </a>
  </div>

  <!-- ✅ Isolated Script for CTA Section -->
  <script>
    (function () {
      // Wait for DOM to be ready
      function initCTASection() {
        const ctaSection = document.getElementById("cta-section");
        const ctaContent = ctaSection?.querySelector(".cta-content");

        if (!ctaSection || !ctaContent) return;

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                ctaContent.classList.add("visible");

                // Use GSAP if available, otherwise use CSS transition
                if (typeof gsap !== "undefined") {
                  gsap.fromTo(
                    ctaContent,
                    { opacity: 0, y: 40 },
                    {
                      opacity: 1,
                      y: 0,
                      duration: 1.2,
                      ease: "power3.out",
                    }
                  );
                }

                observer.unobserve(ctaSection);
              }
            });
          },
          { threshold: 0.3 }
        );

        observer.observe(ctaSection);
      }

      // Initialize when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initCTASection);
      } else {
        initCTASection();
      }
    })();
  </script>
</section>
