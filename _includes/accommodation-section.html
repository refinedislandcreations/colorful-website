<style>
  /* ✨ Smooth image hover tone effect */
  .hover-image {
    transition: all 0.8s ease;
    filter: brightness(100%) saturate(100%);
  }
  .hover-image:hover {
    filter: brightness(110%) saturate(120%) hue-rotate(10deg);
  }

  /* 🌟 Initial state for intro text */
  #split-intro-text .char {
    opacity: 0.15;
    transform: translateY(30px);
  }

  #intro p {
    opacity: 0;
    transform: translateY(40px);
  }
</style>

<section
  class="relative w-full h-screen overflow-hidden bg-gray-100"
  id="scroll-section"
>
  <div class="relative w-screen h-screen">
    <!-- INTRO -->
    <div
      id="intro"
      class="absolute inset-0 flex flex-col sm:flex-row items-center justify-center bg-[#69673a] z-0 text-center sm:text-left px-6 sm:px-12"
    >
      <div class="max-w-7xl">
        <h1
          id="split-intro-text"
          class="text-3xl sm:text-5xl lg:text-6xl uppercase font-extrabold text-[#f8efc1] leading-tight montserrat-black text-left"
        >
          {{ include.intro.title }}
        </h1>
        <p
          class="mt-4 text-base sm:text-lg lg:text-xl text-[#f8efc1] dm-sans-regular mx-auto sm:mx-0 text-left"
        >
          {{ include.intro.description }}
        </p>
      </div>
    </div>

    <!-- SLIDES -->
    {% for slide in include.slides %}
    <div
      class="slide-item absolute inset-0 flex flex-col lg:flex-row items-start lg:items-center justify-between px-6 sm:px-10 lg:px-16 py-12 z-{{ forloop.index | times:10 }} gap-6 lg:gap-12 text-center lg:text-left"
      style="background-color: {{ slide.bg_color }}"
    >
      <div
        class="absolute top-4 left-6 text-2xl font-bold montserrat-bold"
        style="color: {{ slide.text_color }}"
      >
        {{ slide.number }}
      </div>

      <!-- Mobile Layout -->
      <div class="flex flex-col w-full mt-8 lg:hidden">
        <img
          src="{{ slide.image }}"
          alt="{{ slide.image_alt }}"
          class="w-full h-[40vh] object-cover mb-6 shadow-lg hover-image"
        />
        <div class="md:mt-12">
          <h2
            class="text-3xl sm:text-4xl font-bold mb-3 montserrat-bold text-left"
            style="color: {{ slide.text_color }}"
          >
            {{ slide.title }}
          </h2>
          <p
            class="text-base sm:text-lg leading-relaxed dm-sans-regular text-left"
            style="color: {{ slide.text_color }}"
          >
            {{ slide.description }}
          </p>
        </div>
      </div>

      <!-- Desktop Layout -->
      <div class="hidden lg:flex w-full items-center justify-between gap-12">
        <div class="max-w-lg">
          <h2
            class="text-5xl font-bold mb-6 montserrat-bold"
            style="color: {{ slide.text_color }}"
          >
            {{ slide.title }}
          </h2>
          <p
            class="text-lg leading-relaxed dm-sans-regular"
            style="color: {{ slide.text_color }}"
          >
            {{ slide.description }}
          </p>
        </div>
        <img
          src="{{ slide.image }}"
          alt="{{ slide.image_alt }}"
          class="w-[50vw] h-[70vh] object-cover shadow-xl hover-image"
        />
      </div>
    </div>
    {% endfor %}
  </div>
</section>

<!-- ✅ GSAP Scroll Animations -->
<script>
  gsap.registerPlugin(ScrollTrigger);

  document.addEventListener("DOMContentLoaded", () => {
    const splitText = new SplitType("#split-intro-text", { types: "words" });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#intro",
        start: "top 80%",
        end: "bottom 70%",
        scrub: 0.6,
      },
    });

    tl.to(splitText.chars, {
      opacity: 1,
      y: 0,
      stagger: 0.015,
      ease: "power3.out",
      duration: 0.8,
    }).to(
      "#intro p",
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      "-=0.3"
    );

    // 🌀 Scroll stack effect
    const slides = gsap.utils.toArray(".slide-item");
    const scrollSection = document.getElementById("scroll-section");
    const stackGap = 50;

    gsap.set(slides, { y: "100%", opacity: 1 });

    const tlSlide = gsap.timeline({
      scrollTrigger: {
        trigger: scrollSection,
        pin: true,
        scrub: 1,
        start: "top top",
        end: () => `+=${(slides.length - 1) * window.innerHeight}`,
        anticipatePin: 1,
      },
    });

    slides.forEach((slide, i) => {
      tlSlide.to(slide, { y: i * stackGap, duration: 1, ease: "none" }, i);
    });
  });
</script>
