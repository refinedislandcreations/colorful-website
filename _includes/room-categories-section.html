<!-- _includes/room-categories-section.html -->
<!---------------- ROOM CATEGORIES - DIFFERENT CARD STYLE ---------------->
<section class="bg-white py-20 overflow-hidden">
  <div class="container mx-auto px-4">
    <h2
      class="text-4xl font-bold text-center mb-16 opacity-0"
      id="section-heading"
    >
      {{ include.section.heading }}
    </h2>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      {% for room in include.section.rooms %}
      <!-- Card {{ forloop.index }} - Different Style -->
      <div
        class="bg-brand-pink rounded-3xl overflow-hidden shadow-xl opacity-0 translate-y-10"
        id="card-{{ forloop.index }}"
      >
        <div class="h-64 overflow-hidden">
          <img
            src="{{ room.image }}"
            alt="{{ room.alt }}"
            class="w-full h-full object-cover transition-transform duration-700 hover:scale-110"
          />
        </div>
        <div class="p-8">
          <h3 class="text-2xl font-bold mb-4">{{ room.title }}</h3>
          <p class="text-gray-700 mb-6">{{ room.description }}</p>
          <div class="flex justify-between items-center">
            <span class="text-brand-orange font-bold text-xl"
              >{{ room.price }}</span
            >
            <a
              href="{{ room.button_url }}"
              class="bg-brand-orange text-white px-6 py-2 rounded-full hover:bg-black transition-colors"
            >
              {{ room.button_text }}
            </a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
